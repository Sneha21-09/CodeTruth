name: CodeTruth PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  codetruth-impact:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run CodeTruth impact detection
        run: npx tsx src/lib/impact.test.ts

      - name: Generate CodeTruth PR comment
        run: npx tsx src/lib/prComment.test.ts > ../codetruth-report.txt

      - name: Post CodeTruth report to PR
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
         if ! gh pr comment "$PR_NUMBER" --body-file codetruth-report.txt; then
           echo "PR comment unavailable (fork permissions). Report saved in job summary."
           cat codetruth-report.txt >> "$GITHUB_STEP_SUMMARY"
           fi
